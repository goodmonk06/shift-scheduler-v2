[phases.setup]
nixPkgs = ["nodejs_20", "pnpm"]

[phases.install]
cmds = ["pnpm install --frozen-lockfile"]

[phases.build]
cmds = [
  "rm -rf build dist .vite",
  "pnpm build",
  "echo '=== Build Output Check ==='",
  "ls -la dist/ 2>&1 || echo 'dist not found'",
  "ls -la dist/public/ 2>&1 || echo 'dist/public not found'",
  "ls -la dist/index.js 2>&1 || echo 'dist/index.js not found'"
]

[start]
cmd = "node dist/index.js"

[variables]
NODE_ENV = "production"
